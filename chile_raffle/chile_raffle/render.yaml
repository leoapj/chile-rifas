# Blueprint opcional de Render: New + > Blueprint y apuntas a este repo.
# Crea la base PostgreSQL y el servicio web ya conectados.
databases:
  - name: chile-raffle-db
    plan: free          # la BD gratuita de Render caduca a los 30 días: pasa a un plan de pago antes de usarla en serio
    databaseName: chile_raffle
    user: chile_raffle

services:
  - type: web
    name: chile-raffle
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chile-raffle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: TICKET_RESERVATION_MINUTES
        value: "30"
